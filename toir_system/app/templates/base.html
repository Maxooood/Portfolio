<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ТОИР{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-logo">ТО<span>И</span>Р</div>
    <ul class="sidebar-nav">
      <li><a href="/dashboard"><span class="icon">⊞</span> <span>Панель</span></a></li>
      <li><a href="/requests"><span class="icon">☰</span> <span>Заявки</span></a></li>
      <li><a href="/equipment"><span class="icon">⚙</span> <span>Оборудование</span></a></li>
      <li data-roles="admin,manager"><a href="/users"><span class="icon">👤</span> <span>Пользователи</span></a></li>
      <li data-roles="admin,manager,dispatcher"><a href="/analytics"><span class="icon">📊</span> <span>Аналитика</span></a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="sidebar-user-name" id="sb-name"></div>
      <div class="sidebar-user-role" id="sb-role"></div>
      <button class="btn btn-logout" onclick="logout()">↩ <span>Выйти</span></button>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <h1 class="topbar-title">{% block page_title %}{% endblock %}</h1>
      <div>{% block topbar_actions %}{% endblock %}</div>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
